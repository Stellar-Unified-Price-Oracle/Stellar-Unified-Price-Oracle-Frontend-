<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030712" />
    <title>You're offline - Stellar Oracle</title>
    <!--
      Styles and the retry handler live in same-origin files rather than inline
      <style>/onclick, both of which the content security policy in
      vercel.json blocks (see style-src-elem and script-src there).
    -->
    <link rel="stylesheet" href="/offline.css" />
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Stellar Oracle can't reach the network right now. Check your connection and try again — pages you've already visited may still be available from cache.</p>
      <button type="button" id="retry">Retry</button>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
