<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030712" />
    <title>You're offline - Stellar Oracle</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #030712;
        color: #e5e7eb;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      main {
        max-width: 26rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      p {
        color: #9ca3af;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.5rem 1.25rem;
        border-radius: 0.5rem;
        border: 1px solid #374151;
        background: #111827;
        color: #e5e7eb;
        font-size: 0.9rem;
        cursor: pointer;
      }
      button:hover {
        background: #1f2937;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Stellar Oracle can't reach the network right now. Check your connection and try again — pages you've already visited may still be available from cache.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
