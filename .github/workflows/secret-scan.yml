name: Secret Scan (Gitleaks)

# #494 — Scans commits for leaked secrets. Runs on every push/PR against a full
# clone (fetch-depth: 0) so history-scanning catches a secret introduced then
# later removed, not just the current diff, and diff-scans the PR specifically
# so findings point at the exact introducing commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Runs the free gitleaks CLI directly instead of gitleaks-action. The
      # action wrapper requires a commercial GITLEAKS_LICENSE for any
      # organization-owned repository (this repo is org-owned), while the
      # gitleaks binary itself is open source and license-free.
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: v8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          LOG_OPTS=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Diff-scan the PR (same log-opts gitleaks-action uses) so findings
            # point at the exact introducing commit.
            LOG_OPTS=("--log-opts=--all --diff-merges=first-parent ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          fi
          # Full-history scan on push; exits non-zero on any finding (see .gitleaks.toml
          # for the rule set/allowlist).
          ./gitleaks detect --source . --no-banner --config .gitleaks.toml --redact "${LOG_OPTS[@]}"
