name: Release

on:
  push:
    branches: [main, staging, develop]

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write # OIDC identity used to sign the build provenance attestation
  attestations: write # publish the signed attestation to the repo's attestation store

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      # The release commit is generated by semantic-release, not a human
      # contributor, so it must not be gated by the project's git hooks:
      # commitlint rejects the auto-generated `chore(release):` message
      # (changelog footer lines exceed footer-max-line-length), and the
      # pre-commit/pre-push hooks would re-run lint/build/tests on the bot's
      # commit. HUSKY=0 disables every husky hook for this job.
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Dependency policy (#688): fail the build on a disallowed license before
      # anything is built or released. The allow-list lives in
      # .license-allowlist.json; exceptions (with owner + expiry) live in
      # license-exceptions.json, mirroring the sri-exceptions.json conventions.
      - name: Enforce license policy
        run: node scripts/check-licenses.mjs

      # Dependency policy (#688): enforce the severity -> upgrade SLA mapping
      # documented in docs/DEPENDENCY_POLICY.md. Fails when a known advisory has
      # exceeded its remediation window for its severity.
      - name: Enforce vulnerability upgrade SLA
        run: node scripts/check-audit-sla.mjs

      - name: Build
        run: npm run build
        env:
          VITE_USE_MOCK: 'true'

      - name: Run tests
        run: npm run test:run

      - name: Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24.0.0
          branches: |
            [
              "main",
              {"name": "develop", "prerelease": true},
              {"name": "staging", "prerelease": "rc"}
            ]
          dry_run: false
          ci: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Package release artifact
        if: success() && github.ref == 'refs/heads/main'
        run: tar -C dist -czf dist.tar.gz .

      # Dependency policy (#688): generate a CycloneDX SBOM for the exact
      # dependency tree that produced this release and attach it to the release
      # artifacts alongside the build output.
      - name: Generate SBOM (CycloneDX)
        if: success() && github.ref == 'refs/heads/main'
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json

      # Generates a signed SLSA-style provenance attestation binding this exact
      # artifact hash to the commit, workflow, and runner that built it, using
      # GitHub's OIDC-backed Sigstore signing (no stored keys). A failure here
      # stops the job, so an unattested build is never deployed from this workflow.
      - name: Generate build provenance attestation
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist.tar.gz'

      # Dependency policy (#688): attest the SBOM too, so consumers can verify
      # the dependency inventory was produced by this workflow run.
      - name: Attest SBOM provenance
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'sbom.cdx.json'

      - name: Upload to CDN (on main release)
        if: success() && github.ref == 'refs/heads/main'
        run: |
          echo "Build artifacts ready for deployment:"
          ls -lah dist/
        # Replace with actual CDN upload command (e.g., AWS S3, Vercel, etc.)

      # Dependency policy (#688): publish the SBOM as a release asset so it is
      # attached to the release artifacts for every main release.
      - name: Publish SBOM to release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          files: sbom.cdx.json
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const lines = changelog.split('\n');
            const latestEntry = lines.slice(0, 50).join('\n');
            
            core.notice(`Release complete! Check CHANGELOG.md for details.`);
