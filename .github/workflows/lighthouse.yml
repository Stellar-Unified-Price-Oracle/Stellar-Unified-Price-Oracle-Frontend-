name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Lighthouse budget enforcement (#503) ─────────────────────────────────────
# Runs Lighthouse against a real production build (via `vite preview`) for the
# key routes and enforces budgets for LCP, CLS, TBT, and the accessibility
# score. Fails the job on any violation, and posts (or updates) a single PR
# comment with the results and the delta against the last run on main.
#
# Lighthouse metrics are noisy on shared GitHub runners: a contended runner
# can spike TBT well above budget with zero code changes (observed: 346 ms on
# the same source that measured 25 ms 30 minutes earlier, when five workflows
# fired simultaneously). The `lhci` step therefore retries up to 3 attempts,
# clearing partial results between attempts. A genuine regression fails all 3
# attempts and still fails the job; a contention flake passes on retry. The
# budgets themselves are never loosened.
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_USE_MOCK: 'true'

      # Baseline from the last successful run on the base branch, used to
      # compute the score/metric deltas shown in the PR comment. A cache miss
      # (first run, or cache evicted) just means the comment reports current
      # numbers without a delta — never blocks the job.
      - name: Restore Lighthouse baseline
        uses: actions/cache/restore@v4
        with:
          path: lighthouse-baseline.json
          key: lighthouse-baseline-${{ github.base_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            lighthouse-baseline-${{ github.base_ref || github.ref_name }}-

      # Retry up to 3 attempts. Each attempt is a full `lhci autorun`; partial
      # results from a failed attempt are cleared so the next attempt starts
      # clean, and any lingering preview server from a killed attempt is
      # stopped so `--strictPort` doesn't fail the retry.
      - name: Run Lighthouse CI (retry on runner contention)
        id: lhci
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "::group::Lighthouse attempt $attempt of 3"
            npx @lhci/cli@0.14.x autorun --config=.lighthouserc.json
            code=$?
            echo "::endgroup::"
            if [ "$code" -eq 0 ]; then
              echo "passed=true" >> "$GITHUB_OUTPUT"
              echo "Lighthouse passed on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed (exit $code) — retrying."
            if [ "$attempt" -lt 3 ]; then
              rm -rf .lighthouseci
              pkill -f 'vite preview' 2>/dev/null || true
              sleep 5
            fi
          done
          echo "passed=false" >> "$GITHUB_OUTPUT"
          echo "Lighthouse failed 3 consecutive attempts."
          exit 0

      - name: Report results
        run: node scripts/lighthouse-report.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASELINE_SUMMARY: lighthouse-baseline.json
          BASELINE_OUT: lighthouse-baseline.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 30

      # On main, refresh the baseline that PR runs diff against.
      - name: Save Lighthouse baseline
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: lighthouse-baseline.json
          key: lighthouse-baseline-${{ github.ref_name }}-${{ github.sha }}

      # Fail the job if all retry attempts failed. The report step above also
      # exits non-zero when any budget is violated, so this step is the
      # authoritative "never passed" gate for the retry loop.
      - name: Fail if Lighthouse never passed
        if: steps.lhci.outputs.passed != 'true'
        run: |
          echo "Lighthouse failed 3 consecutive attempts — genuine regression or persistent runner contention."
          exit 1