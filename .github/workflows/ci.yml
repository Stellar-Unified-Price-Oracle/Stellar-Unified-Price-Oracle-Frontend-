name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail CI on any critical or high severity vulnerabilities.
      # Moderate and low findings are reported but do not block the build.
      - name: Audit dependencies (fail on critical/high)
        run: npm audit --audit-level=high

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build
        env:
          VITE_USE_MOCK: 'true'

      # Fail CI when a new CDN script/stylesheet is added without an `integrity`
      # attribute and without a reviewed exception in sri-exceptions.json.
      - name: Subresource Integrity check
        run: node scripts/check-sri.js

      # ── Asset pipeline (#681) ─────────────────────────────────────────────
      # Generate modern formats (AVIF/WebP) and responsive variants for every
      # source image, then enforce the per-asset budgets declared in
      # assets.config.json. A single oversized asset can otherwise blow the
      # startup budget (#614), so this gate fails the build on any violation.
      - name: Build responsive image variants (AVIF/WebP)
        run: node scripts/build-assets.js

      - name: Check per-asset budgets
        run: node scripts/check-asset-budgets.js

      # Report how much each asset category contributes to the startup budget
      # so regressions are visible in the job summary alongside JS budgets.
      - name: Report asset contribution to startup budget
        run: node scripts/report-asset-budget.js

      - run: npm run test:run

      - name: Test SDK offline fixture server
        run: npm run sdk:fixture-smoke

      # Render profiling gate (#677): renders key views with a fixed, seeded
      # dataset and asserts per-component render counts against the checked-in
      # budgets in perf/render-budgets.json. A planted missing-`memo` or an
      # unstable prop regresses the counts and fails this step.
      - name: Render profiling budgets
        run: npm run perf:render

      # Upload hidden source maps to Sentry for production error tracking,
      # then strip them from the deployment artifact so they are never
      # served to end-users or uploaded to the CDN.
      - name: Upload source maps to Sentry
        if: github.ref == 'refs/heads/main' && env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          npx @sentry/cli@latest sourcemaps upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            dist/assets

      - name: Strip source maps from deploy artifact
        run: find dist/assets -name '*.map' -delete

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build
          path: dist/

  e2e:
    needs: [frontend]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist/

      - run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run test:e2e

  # ── Interaction latency (INP) budget ────────────────────────────────────────
  # Enforces the p75 INP budget (< 200ms) for key interactions — filter change,
  # row click, alert create — on a scripted mid-range CPU profile. Fails CI when
  # a scripted interaction regresses beyond the budget (#683).
  interaction-latency:
    needs: [frontend]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist/

      - run: npx playwright install --with-deps chromium

      - name: Measure INP against budget
        run: npm run test:perf:inp
        env:
          CI: 'true'
          INP_BUDGET_MS: '200'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inp-report
          path: reports/inp/
          retention-days: 14

  # ── Visual regression ───────────────────────────────────────────────────────
  # Compares screenshots against baselines stored in e2e/snapshots/.
  # The job fails if any screenshot differs beyond the configured threshold.
  #
  # To update baselines locally:
  #   npm run test:e2e:visual:update
  #   git add e2e/snapshots/ && git commit -m "chore: update visual baselines"
  visual-regression:
    needs: [frontend]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Treat as advisory on PRs — screenshot diffs require manual review and a
    # deliberate baseline update commit, not an automatic failure gate.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist/

      # Only install Chromium — visual baselines are browser-specific and we
      # intentionally generate/compare against Chromium only for consistency.
      - run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: npm run test:e2e:visual
        env:
          CI: 'true'

      # Upload the HTML report so reviewers can inspect pixel diffs in the
      # GitHub Actions UI even when the job succeeds.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-report
          path: reports/playwright/
          retention-days: 14

      # Upload any diff screenshots Playwright generated for failed comparisons.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-diffs
          path: test-results/
          retention-days: 7

  # ── Bundle size analysis ────────────────────────────────────────────────────
  # Builds with the visualizer enabled, enforces the size-limit budgets
  # configured in package.json, uploads the visualization for historical
  # inspection, and (on PRs) comments the size diff against the base branch.
  #
  # Note: deliberately builds WITHOUT VITE_USE_MOCK. The mock build bundles
  # MSW handlers and fixture data (~72 kB) that never ships to users; the
  # budget gate exists to catch bloat in what users actually download.
  bundle-analysis:
    needs: [frontend]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      # write is only exercised by the size-history commit step below, which
      # only runs on pushes to main (never on PRs, dependabot's included).
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build with bundle visualization
        run: npm run build:analyze

      # Machine-readable budget results (name/size/sizeLimit/passed per
      # check), captured before the pass/fail step below so a breach is still
      # recorded for the history/comment steps that read this file (#511).
      - name: Record bundle size results
        run: npx size-limit --json --silent > reports/size-limit.json

      # Enforce separate budgets for initial (entry) chunks and deferred
      # (lazy-loaded) feature chunks (#864). Each category is checked
      # independently against budgets.config.json so a regression in either
      # fails CI on its own, without masking the other.
      - name: Check initial chunk budgets
        run: node scripts/check-bundle-budgets.js --category=initial

      - name: Check deferred chunk budgets
        run: node scripts/check-bundle-budgets.js --category=deferred

      - name: Check bundle size against budgets
        run: npm run size-limit

      # Asset cost is part of the startup budget; report it alongside JS
      # budgets so reviewers can see the full initial-load picture.
      - name: Report asset contribution to startup budget
        run: node scripts/report-asset-budget.js
