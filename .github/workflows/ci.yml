name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail CI on any critical or high severity vulnerabilities.
      # Moderate and low findings are reported but do not block the build.
      - name: Audit dependencies (fail on critical/high)
        run: npm audit --audit-level=high

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build
        env:
          VITE_USE_MOCK: 'true'

      # Fail CI when a new CDN script/stylesheet is added without an `integrity`
      # attribute and without a reviewed exception in sri-exceptions.json.
      - name: Subresource Integrity check
        run: node scripts/check-sri.js

      - run: npm run test:run

      # Upload hidden source maps to Sentry for production error tracking,
      # then strip them from the deployment artifact so they are never
      # served to end-users or uploaded to the CDN.
      - name: Upload source maps to Sentry
        if: github.ref == 'refs/heads/main' && env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          npx @sentry/cli@latest sourcemaps upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            dist/assets

      - name: Strip source maps from deploy artifact
        run: find dist/assets -name '*.map' -delete

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build
          path: dist/

  e2e:
    needs: [frontend]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist/

      - run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run test:e2e

  # ── Visual regression ───────────────────────────────────────────────────────
  # Compares screenshots against baselines stored in e2e/snapshots/.
  # The job fails if any screenshot differs beyond the configured threshold.
  #
  # To update baselines locally:
  #   npm run test:e2e:visual:update
  #   git add e2e/snapshots/ && git commit -m "chore: update visual baselines"
  visual-regression:
    needs: [frontend]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Treat as advisory on PRs — screenshot diffs require manual review and a
    # deliberate baseline update commit, not an automatic failure gate.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist/

      # Only install Chromium — visual baselines are browser-specific and we
      # intentionally generate/compare against Chromium only for consistency.
      - run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: npm run test:e2e:visual
        env:
          CI: 'true'

      # Upload the HTML report so reviewers can inspect pixel diffs in the
      # GitHub Actions UI even when the job succeeds.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-report
          path: reports/playwright/
          retention-days: 14

      # Upload any diff screenshots Playwright generated for failed comparisons.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-diffs
          path: test-results/
          retention-days: 7

  # ── Bundle size analysis ────────────────────────────────────────────────────
  # Builds with the visualizer enabled, enforces the size-limit budgets
  # configured in package.json, uploads the visualization for historical
  # inspection, and (on PRs) comments the size diff against the base branch.
  bundle-analysis:
    needs: [frontend]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      # write is only exercised by the size-history commit step below, which
      # only runs on pushes to main (never on PRs, dependabot's included).
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build with bundle visualization
        run: npm run build:analyze
        env:
          VITE_USE_MOCK: 'true'

      # Machine-readable budget results (name/size/sizeLimit/passed per
      # check), captured before the pass/fail step below so a breach is still
      # recorded for the history/comment steps that read this file (#511).
      - name: Record bundle size results
        run: npx size-limit --json --silent > reports/size-limit.json

      - name: Check bundle size against budgets
        run: npm run size-limit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analysis-${{ github.sha }}
          path: reports/bundle-analysis.html
          retention-days: 90

      # Dependabot-authored PRs get a read-only GITHUB_TOKEN on the pull_request
      # event (a GitHub security restriction), so this job cannot comment
      # directly on them — dependabot-bundle-size.yml picks this artifact up
      # via workflow_run (which runs with normal repo permissions) instead.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: size-limit-result
          path: reports/size-limit.json
          retention-days: 90

      # Appends this run's sizes to the checked-in history file so budget
      # trends are visible over time (#511), not just per-PR. Only on pushes
      # to main — PR branches don't get history commits.
      - name: Record size history
        if: >
          !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          node -e "
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('reports/size-limit.json', 'utf-8'));
            const entry = {
              sha: process.env.GITHUB_SHA,
              date: new Date().toISOString(),
              results: results.map(r => ({ name: r.name, size: r.size, sizeLimit: r.sizeLimit, passed: r.passed })),
            };
            fs.appendFileSync('.github/bundle-size-history.jsonl', JSON.stringify(entry) + '\n');
          "
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/bundle-size-history.jsonl
          git diff --cached --quiet || git commit -m 'chore(bundle-size): record size history [skip ci]'
          git push

      # Comments the gzip/brotli size diff between this PR and its base branch,
      # using the same size-limit config as the budget check above. Advisory —
      # a failure here shouldn't block the build. Does not fire for Dependabot
      # PRs (read-only token — see dependabot-bundle-size.yml instead).
      - name: Compare bundle size to base branch
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # ── API version compatibility check ────────────────────────────────────────
  # Verifies the frontend's declared version range is compatible with the
  # running backend. Skips gracefully when no backend is available (e.g. on
  # frontend-only PRs). Set BACKEND_API_URL to point at a live/staging backend.
  #
  # To run locally:
  #   VITE_API_URL=http://localhost:3000 npm run check:api-version
  api-version-check:
    needs: [frontend]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Non-blocking: backend may not be running in every CI environment.
    # The script already exits 0 when the server is unreachable.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check API version compatibility
        run: node scripts/check-api-version.js
        env:
          # Override with a real backend URL in repository secrets when available.
          VITE_API_URL: ${{ vars.BACKEND_API_URL || 'http://localhost:3000' }}

  # ── IndexedDB write-burst benchmark ─────────────────────────────────────────
  # Guards against reintroducing per-write eviction scans / transaction
  # overhead in the useIdbQuery/useIndexedDB layer (#510). See
  # scripts/bench-idb.mjs and docs/STORAGE_BUDGET.md.
  #
  # Advisory (continue-on-error): timings vary across shared CI runners, so
  # this reports regressions without blocking merges on runner noise.
  idb-benchmark:
    needs: [frontend]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Benchmark IndexedDB write bursts
        run: npm run bench:idb

  # ── Deploy to Staging ───────────────────────────────────────────────────────
  # Automatically deploys the main branch to a staging environment after all
  # tests pass. Staging uses production-like configuration but points to test
  # API endpoints. Access is gated via basic auth.
  #
  # This job runs only on pushes to main (not on PRs), and only if all prior
  # jobs passed. Requires VERCEL_TOKEN and VERCEL_ORG_ID secrets to be set.
  deploy-staging:
    needs: [frontend, e2e, visual-regression]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.example.com
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build for staging
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.STAGING_API_URL }}
          VITE_WS_URL: ${{ secrets.STAGING_WS_URL }}
          NODE_ENV: production

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist/

      - name: Deploy to Vercel staging
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
        run: |
          npm install -g vercel@latest
          vercel deploy \
            --token "$VERCEL_TOKEN" \
            --prod \
            --build-env VITE_API_URL="${{ secrets.STAGING_API_URL }}" \
            --build-env VITE_WS_URL="${{ secrets.STAGING_WS_URL }}"

      - name: Create deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'staging',
              required_contexts: [],
              auto_merge: false,
            })

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: '${{ job.status }}',
              description: 'Deployment to staging',
              environment_url: 'https://staging.example.com',
            })

      - name: Notify deployment
        if: github.ref == 'refs/heads/main'
        run: |
          echo "✅ Staging deployment complete"
          echo "Staging URL: https://staging.example.com"
          echo "API: ${{ secrets.STAGING_API_URL }}"
          echo "WebSocket: ${{ secrets.STAGING_WS_URL }}"
