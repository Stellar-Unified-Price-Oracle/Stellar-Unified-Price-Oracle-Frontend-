name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail CI on any critical or high severity vulnerabilities.
      # Moderate and low findings are reported but do not block the build.
      - name: Audit dependencies (fail on critical/high)
        run: npm audit --audit-level=high

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build
        env:
          VITE_USE_MOCK: 'true'

      - run: npm run test:run

      # Upload hidden source maps to Sentry for production error tracking,
      # then strip them from the deployment artifact so they are never
      # served to end-users or uploaded to the CDN.
      - name: Upload source maps to Sentry
        if: github.ref == 'refs/heads/main' && env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          npx @sentry/cli@latest sourcemaps upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            dist/assets

      - name: Strip source maps from deploy artifact
        run: find dist/assets -name '*.map' -delete

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build
          path: dist/

  e2e:
    needs: [frontend]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist/

      - run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run test:e2e
