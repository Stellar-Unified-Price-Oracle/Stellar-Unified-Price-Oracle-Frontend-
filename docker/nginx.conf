server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip responses for text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Health check endpoint (does not serve from disk)
    location = /health {
        access_log off;
        return 200 "ok\n";
        default_type text/plain;
    }

    # Hashed static assets — cache aggressively
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html — never cache so the latest deployment is always loaded
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # All other routes fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
